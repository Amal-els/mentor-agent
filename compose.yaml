services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor_dev_only
      POSTGRES_DB: mentor
    ports:
      # 5432/5433 are already bound by a native Postgres service on this
      # Windows host; 55432 avoids the collision. Override via .env
      # (DATABASE_URL) if your host is different.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor"]
      interval: 2s
      timeout: 2s
      retries: 15
